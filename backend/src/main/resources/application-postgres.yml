spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trainlab}
    username: ${DB_USER:trainlab}
    password: ${DB_PASSWORD:trainlab}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  seed:
    enabled: ${SEED_ENABLED:false}
