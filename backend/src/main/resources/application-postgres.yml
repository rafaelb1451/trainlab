spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trainlab}
    username: ${DB_USER:trainlab}
    password: ${DB_PASSWORD:trainlab}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Primeira fase de producao: o Hibernate mantem o schema.
      # Quando o modelo estabilizar, trocar por Flyway + ddl-auto: validate.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

server:
  # Atras do Caddy: confia nos cabecalhos X-Forwarded-* (IP real do cliente e HTTPS).
  forward-headers-strategy: native

app:
  seed:
    enabled: ${SEED_ENABLED:false}
