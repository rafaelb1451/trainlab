# Perfil de desenvolvimento: sobe com dados demo.
# Rodar com: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#        ou: java -jar app.jar --spring.profiles.active=dev
#
# O perfil base NAO popula dados e nao cria contas com senha conhecida.
app:
  seed:
    enabled: true
  mail:
    # Em desenvolvimento o resumo sai em 1 minuto: da' para ver o e-mail sem esperar 15.
    digest-interval-ms: 60000
    digest-initial-delay-ms: 15000

logging:
  level:
    com.trainlab: DEBUG
