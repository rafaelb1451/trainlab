server:
  port: 8080

spring:
  application:
    name: trainlab-backend
  datasource:
    # Sem AUTO_SERVER: no Windows o H2 cai para FILE_LOCK=FS e a combinacao
    # e' rejeitada ("Feature not supported"), derrubando a inicializacao.
    # Para abrir o console H2 em outro processo, use o perfil "console".
    url: jdbc:h2:file:./data/trainlab
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  h2:
    console:
      enabled: false

app:
  jwt:
    # Sem valor de fallback versionado. Sem JWT_SECRET o servidor gera uma chave
    # aleatoria por execucao (dev); em producao defina a variavel.
    secret: ${JWT_SECRET:}
    expiration-ms: 43200000
    # Marque true quando a API estiver atras de HTTPS (cookie Secure).
    cookie-secure: ${COOKIE_SECURE:false}
  seed:
    enabled: ${SEED_ENABLED:false}
  integration:
    # Chave usada para cifrar as credenciais de integracao no banco.
    # Sem ela, o servidor cria e guarda uma chave local em ./data/integration.key.
    secret: ${INTEGRATION_SECRET:}

logging:
  level:
    root: INFO
    com.trainlab: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
